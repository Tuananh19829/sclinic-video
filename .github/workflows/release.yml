name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Sclinic Video v__VERSION__"
          releaseBody: |
            **Based on shdw by d4niel-fr — https://github.com/d4niel-fr/shdw-video-editor**

            Sclinic Video là bản đã chỉnh sửa (Việt hoá, đặt tên lớp timeline, đổi thương hiệu), không phải bản shdw chính thức. Mã nguồn theo GNU AGPL-3.0 kèm điều khoản ghi công (LICENSE, NOTICE).

            ## Tải về

            | Hệ điều hành | File |
            | --- | --- |
            | **Windows 10/11** | `Sclinic.Video_x.y.z_x64-setup.exe` (khuyên dùng) hoặc `.msi` |
            | **macOS 11+** | `Sclinic.Video_x.y.z_universal.dmg` |

            **Windows:** bộ cài chưa ký số, nếu SmartScreen cảnh báo bấm More info → Run anyway.
            **macOS:** app chưa notarize. Sau khi kéo vào Applications, chạy một lần:
            `xattr -cr "/Applications/Sclinic Video.app"` rồi mở bình thường.

            **Cần thêm:** FFmpeg, trình duyệt Edge/Chrome, và `claude` (Claude Code) hoặc `codex` đã đăng nhập.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
